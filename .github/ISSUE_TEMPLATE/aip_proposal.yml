name: AIP Proposal
description: Submit an AFW Improvement Proposal for significant changes
title: "[AIP-XXXX] "
labels: ["type/aip"]
body:
  - type: markdown
    attributes:
      value: |
        AFW Improvement Proposals (AIPs) are required for significant changes to the project.
        Please fill out this template thoroughly. AIPs go through a 7-day discussion + 3-day vote.

  - type: input
    id: title
    attributes:
      label: AIP Title
      placeholder: "e.g., Add cross-chain bridge for ETH mainnet"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Core (Smart Contract)
        - Tokenomics ($AFW / $SOUL)
        - Governance
        - World (New Zone / Major Content)
        - Infrastructure
        - Process
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph explaining the proposal
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Technical Specification
      description: Detailed technical description of the proposed change
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks & Mitigation
      description: What could go wrong? How will you address it?

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have discussed this idea in GitHub Discussions before submitting
          required: true
        - label: I understand this AIP will go through a 7-day discussion period
          required: true
