name: World Content Proposal
description: Propose a new quest, monster, zone, or item
title: "[World] "
labels: ["scope/world"]
body:
  - type: markdown
    attributes:
      value: |
        Propose new content for the AFW world! Quests, monsters, zones, and items are all welcome.
        Approved content earns you a permanent 5% $SOUL royalty.

  - type: dropdown
    id: content_type
    attributes:
      label: Content Type
      options:
        - Quest
        - Monster
        - Zone
        - Item
        - NPC
        - Event
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Content Description
      description: Describe your content in detail. Include stats, behavior, rewards, etc.
    validations:
      required: true

  - type: textarea
    id: lore
    attributes:
      label: Lore / Story
      description: How does this fit into the Aethermoor world?

  - type: dropdown
    id: zone
    attributes:
      label: Target Zone
      options:
        - Lumenveil (Village, Safe)
        - Graymarch (Plains, Medium)
        - Embervault (Dungeon, Danger)
        - Voidreach (Abyss, Extreme)
        - New Zone Proposal
    validations:
      required: true

  - type: textarea
    id: balance
    attributes:
      label: Balance Considerations
      description: How should this be balanced? Difficulty, rewards, requirements?

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: This content is original and does not infringe on any copyright
          required: true
        - label: I agree to license this content under MIT for the AFW project
          required: true
