name: ✨ Feature Request
description: 새로운 기능을 제안해주세요
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 문제나 불편함을 느끼셨나요?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 관련 레이어
      options:
        - Layer 0 — 블록체인 코어
        - Layer 1 — 월드 데이터/콘텐츠
        - Layer 2 — 렌더러/그래픽
        - Layer 3 — 클라이언트/UI
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안

  - type: checkboxes
    id: aip
    attributes:
      label: AIP 필요 여부
      options:
        - label: 이 변경사항은 AIP(AFW Improvement Proposal)가 필요합니다
