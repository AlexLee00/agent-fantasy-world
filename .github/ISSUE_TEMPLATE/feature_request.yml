name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Smart Contract (contracts/)
        - Agent Engine (agents/)
        - World Data (world/)
        - Client / UI (client/)
        - Node Software (node/)
        - Tokenomics
        - Governance
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
